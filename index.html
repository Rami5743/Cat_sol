<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>סוליטר מילים</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@400;700&family=Heebo:wght@400;500;700&display=swap">
<link rel="stylesheet" href="style.css?v=8">
</head>
<body>
<div class="menu" id="menu">
  <div class="menu-card">
    <h1 id="menu-title"></h1>
    <p class="menu-lead" id="menu-lead"></p>

    <div class="choice">
      <span class="choice-label" id="lang-label"></span>
      <div class="options" id="opt-lang"></div>
    </div>

    <div class="choice">
      <span class="choice-label" id="level-label"></span>
      <div class="options" id="opt-level"></div>
      <p class="choice-hint" id="level-hint"></p>
    </div>

    <button type="button" class="primary" id="btn-start"></button>

    <details class="rules" id="menu-rules">
      <summary></summary>
      <ul></ul>
    </details>
  </div>
</div>

<div class="board" id="game" hidden>
  <header class="masthead">
    <h1 id="game-title"></h1>
    <div class="stats">
      <div class="stat"><span class="stat-label" id="lbl-moves"></span><span class="stat-value" id="stat-moves">0</span></div>
      <div class="stat"><span class="stat-label" id="lbl-time"></span><span class="stat-value" id="stat-time">0:00</span></div>
      <div class="stat stat-err"><span class="stat-label" id="lbl-errors"></span><span class="stat-value" id="stat-errors">0</span></div>
      <div class="stat"><span class="stat-label" id="lbl-hints"></span><span class="stat-value" id="stat-hints">0</span></div>
      <button type="button" class="stat hint-btn" id="btn-hint" aria-pressed="false"></button>
    </div>
  </header>

  <section class="band">
    <div class="zone zone-foundations">
      <div class="slots" id="foundations"></div>
    </div>
    <div class="zone zone-stock">
      <div class="deck-row">
        <div class="slots" id="stock"></div>
        <div class="slots" id="waste"></div>
      </div>
    </div>
  </section>

  <section class="zone zone-tableau">
    <div class="tableau" id="tableau"></div>
  </section>

  <div class="controls">
    <button type="button" id="btn-undo"></button>
    <span class="dropdown">
      <button type="button" id="btn-more" aria-haspopup="true" aria-expanded="false"></button>
      <div class="pop" id="more-pop" hidden>
        <button type="button" id="btn-same-deal"></button>
        <button type="button" id="btn-same-words"></button>
        <button type="button" id="btn-new-set"></button>
        <button type="button" id="btn-menu"></button>
      </div>
    </span>
    <button type="button" id="btn-sound" class="btn-toggle" aria-pressed="true"></button>
  </div>

  <details class="rules" id="game-rules">
    <summary></summary>
    <ul></ul>
  </details>
</div>

<div class="win" id="win" hidden>
  <div class="win-card">
    <h2 id="win-title"></h2>
    <p id="win-text"></p>
    <div class="win-stats">
      <div class="stat"><span class="stat-label" id="wlbl-moves"></span><span class="stat-value" id="win-moves">0</span></div>
      <div class="stat"><span class="stat-label" id="wlbl-time"></span><span class="stat-value" id="win-time">0:00</span></div>
      <div class="stat stat-err"><span class="stat-label" id="wlbl-errors"></span><span class="stat-value" id="win-errors">0</span></div>
      <div class="stat"><span class="stat-label" id="wlbl-hints"></span><span class="stat-value" id="win-hints">0</span></div>
    </div>
    <div class="controls controls--centred">
      <button type="button" id="btn-win-words"></button>
      <button type="button" class="primary" id="btn-win-set"></button>
      <button type="button" id="btn-win-menu"></button>
    </div>
  </div>
</div>

<div class="bubble" id="bubble" hidden></div>
<script src="banks.js?v=8"></script>
<script src="glosses.js?v=8"></script>
<script src="deal.js?v=8"></script>
<script src="game.js?v=8"></script>
</body>
</html>
