<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="only light">
<title>בדיקה ב</title>
<style>
/* הפעם ההצהרה ברמת הדף, כפי שהיא אמורה להיכתב */
:root { color-scheme: only light; }
body { margin: 0; background: #ffffff; color: #000000; font-family: system-ui, sans-serif; }
.wrap { padding: 10px; display: flex; flex-direction: column; gap: 8px; }
.title { font-size: 15px; font-weight: 700; }
.big { height: 70px; background: #ffffff; border: 2px solid #888; display: grid; place-items: center; font-weight: 700; }
.ladder { display: flex; flex-direction: column; }
.step { height: 34px; display: flex; align-items: center; justify-content: space-between; padding: 0 10px; font-size: 13px; font-weight: 700; }
.note { font-size: 13px; background: #eeeeee; padding: 8px; border-radius: 5px; }
#info { font-size: 12px; background: #eeeeee; padding: 8px; border-radius: 5px; word-break: break-all; }
</style>
</head>
<body>
<div class="wrap">
  <div class="title">דף שמצהיר ברמת הדף: רק בהיר</div>
  <div class="big">אם זה לבן — ההצהרה עובדת</div>
  <div class="note">סולם אפורים. לכל שלב רשום הגוון שהוא אמור להיות.</div>
  <div class="ladder" id="ladder"></div>
  <div id="info"></div>
</div>
<script>
var steps = ['#ffffff','#eeeeee','#dddddd','#c8c8c8','#b0b0b0','#989898','#808080',
             '#686868','#505050','#383838','#202020','#101010'];
var l = document.getElementById('ladder');
steps.forEach(function (c) {
  var d = document.createElement('div');
  d.className = 'step';
  d.style.background = c;
  var i = parseInt(c.slice(1, 3), 16);
  d.style.color = i > 140 ? '#000000' : '#ffffff';
  var a = document.createElement('span'); a.textContent = c;
  var b = document.createElement('span'); b.textContent = c;
  d.appendChild(a); d.appendChild(b);
  l.appendChild(d);
});
document.getElementById('info').textContent =
  'מעדיף כהה: ' + matchMedia('(prefers-color-scheme: dark)').matches +
  ' | דפדפן: ' + navigator.userAgent;
</script>
</body>
</html>
